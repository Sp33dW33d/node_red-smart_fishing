services:
  node-red:
    image: nodered/node-red:5.0.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-1880}:1880"
    environment:
      TZ: ${TZ:-Asia/Calcutta}
      FLOWS: flows/smart-fishing.json
      NODE_RED_FORCE_IPV4: ${NODE_RED_FORCE_IPV4:-true}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?Set NODE_RED_CREDENTIAL_SECRET in .env}
      LOCATION_LATITUDE: ${LOCATION_LATITUDE:-18.9110}
      LOCATION_LONGITUDE: ${LOCATION_LONGITUDE:-72.8253}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
      MARINE_API_URL: ${MARINE_API_URL:-https://marine-api.open-meteo.com/v1/marine}
    volumes:
      - ./node-red:/data
      - ./flows:/data/flows
