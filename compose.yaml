services:
  node-red:
    image: nodered/node-red:5.0.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-1880}:1880"
    environment:
      TZ: ${TZ:-Asia/Calcutta}
      FLOWS: flows/smart-fishing.json
      NODE_RED_FORCE_IPV4: ${NODE_RED_FORCE_IPV4:-true}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?Set NODE_RED_CREDENTIAL_SECRET in .env}
      LOCATION_NAME: ${LOCATION_NAME:-Sassoon Dock, Mumbai}
      LOCATION_LATITUDE: ${LOCATION_LATITUDE:-18.9110}
      LOCATION_LONGITUDE: ${LOCATION_LONGITUDE:-72.8253}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
      MARINE_API_URL: ${MARINE_API_URL:-https://marine-api.open-meteo.com/v1/marine}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mosquitto}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-smartfishing}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TOPIC_PREFIX:-smartfishing}/+/telemetry
    depends_on:
      - mosquitto
      - history-cache
    volumes:
      - ./node-red:/data
      - ./flows:/data/flows

  history-cache:
    image: python:3.13.18-slim-bookworm
    restart: unless-stopped
    environment:
      TZ: UTC
      LOCATION_NAME: ${LOCATION_NAME:-Sassoon Dock, Mumbai}
      LOCATION_LATITUDE: ${LOCATION_LATITUDE:-18.9110}
      LOCATION_LONGITUDE: ${LOCATION_LONGITUDE:-72.8253}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.open-meteo.com/v1/forecast}
      MARINE_API_URL: ${MARINE_API_URL:-https://marine-api.open-meteo.com/v1/marine}
      HISTORY_CACHE_INTERVAL_SECONDS: ${HISTORY_CACHE_INTERVAL_SECONDS:-3600}
      HISTORY_CACHE_HTTP_PORT: 8080
    command: ["python", "/app/history-cache.py"]
    expose:
      - "8080"
    volumes:
      - ./scripts/history-cache.py:/app/history-cache.py:ro
      - ./cache:/cache

  telemetry-simulator:
    build:
      context: ./scripts
      dockerfile: Dockerfile.simulator
    restart: unless-stopped
    environment:
      MQTT_PUBLISHER_HOST: mosquitto
      MQTT_PUBLISHER_PORT: 1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-smartfishing}
      MQTT_DEVICE_ID: ${MQTT_DEVICE_ID:-demo-01}
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

volumes:
  mosquitto_data:
